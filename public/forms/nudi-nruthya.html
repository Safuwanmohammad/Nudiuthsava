<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nudi Nruthya Sambhrama Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/style.css">
</head>

<body>
<section class="form-section">
<div class="form-box">

<a href="../index.html" class="back-btn">← Back to Home</a>
<h1>NUDI NRUTHYA SAMBHRAMA</h1>

<form id="registrationForm">
<div class="form-group">
<label>College Name</label>
<input type="text" name="collegeName" required>
</div>

<div class="form-group">
<label>Group Coordinator Name</label>
<input type="text" name="coordinatorName" required>
</div>

<div class="form-group">
<label>Coordinator Phone Number</label>
<input type="tel" name="coordinatorPhone" required>
</div>

<div class="form-group">
<label>College Email ID</label>
<input type="email" name="collegeEmail" required>
</div>

<div class="form-group">
<label>Group Name</label>
<input type="text" name="groupName" required>
</div>

<div class="form-group">
<label>Message (Optional)</label>
<textarea name="message" rows="4"></textarea>
</div>

<div class="form-buttons">
<button type="submit" class="submit-btn">Submit</button>
<button type="reset" class="reset-btn">Reset</button>
</div>

<div id="successMessage" class="success" style="display:none;">✅ Registration successful!</div>

</form>
</div>
</section>
<script>
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        try {
            const res = await fetch('/api/registrations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    eventName: 'Nudi Nruthya Sambhrama',
                    formData: data
                })
            });
            if (res.ok) {
                document.getElementById('successMessage').style.display = 'block';
                e.target.reset();
                setTimeout(() => document.getElementById('successMessage').style.display = 'none', 3000);
            } else {
                alert('Registration failed');
            }
        } catch (err) {
            console.error(err);
            alert('Error submitting form');
        }
    });
</script>
</body>
</html>
