<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login · Nudi Utsava</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;

background:
radial-gradient(circle at top left, rgba(255,215,0,0.5), transparent 55%),
radial-gradient(circle at bottom right, rgba(183,28,28,0.6), transparent 60%),
linear-gradient(160deg,#FFF3C4,#FFE082,#F5B7B1,#C62828);

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{

background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);

border-radius:40px;
padding:50px;

width:450px;
max-width:100%;

box-shadow:0 25px 50px rgba(0,0,0,0.2);

text-align:center;

}

.logo{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:30px;
}

.logo img{
width:60px;
height:60px;
border-radius:50%;
}

.logo h2{
font-family:'Playfair Display',serif;
color:#8E0000;
}

h1{
color:#8E0000;
margin-bottom:30px;
font-size:2rem;
}

.form-group{
margin-bottom:25px;
text-align:left;
}

label{
font-weight:600;
color:#8E0000;
display:block;
margin-bottom:8px;
}

input{

width:100%;

padding:15px 20px;

border-radius:50px;
border:1px solid #ddd;

font-size:1rem;

outline:none;
transition:0.2s;

}

input:focus{
border-color:#8E0000;
}

.submit-btn{

background:#8E0000;

color:white;

border:none;

padding:15px 30px;

border-radius:50px;

font-size:1.2rem;

font-weight:600;

width:100%;

cursor:pointer;

transition:0.2s;

}

.submit-btn:hover{
background:#C62828;
}

.error{

color:#C62828;

margin-top:15px;

font-weight:500;

min-height:20px;

}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<img src="/images/NudiUtsava Logo_2.png" alt="Logo">
<h2>ನುಡಿ ಉತ್ಸವ</h2>
</div>

<h1>Admin Login</h1>

<form id="loginForm">

<div class="form-group">
<label>Username</label>
<input type="text" id="username" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<button type="submit" class="submit-btn">
<i class="fa fa-sign-in-alt"></i> Login
</button>

<div id="loginError" class="error"></div>

</form>

</div>

<script>

const loginForm = document.getElementById("loginForm");
const errorBox = document.getElementById("loginError");

loginForm.addEventListener("submit", async function(e){

e.preventDefault();

errorBox.textContent = "";

const username = document.getElementById("username").value.trim();
const password = document.getElementById("password").value.trim();

if(!username || !password){

errorBox.textContent = "Please enter username and password";
return;

}

try{

const response = await fetch("/admin/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
credentials:"include",
body:JSON.stringify({
username:username,
password:password
})
});

const data = await response.json();

if(response.ok && data.success){

window.location.href="/dashboard";

}else{

errorBox.textContent = data.error || "Invalid username or password";

}

}catch(error){

console.error("Login error:",error);

errorBox.textContent="Server error. Please try again.";

}

});

</script>

</body>
</html>
