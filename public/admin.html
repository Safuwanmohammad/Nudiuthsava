<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nudi Utsava · Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top left, rgba(255,215,0,0.5), transparent 55%),
                        radial-gradient(circle at bottom right, rgba(183,28,28,0.6), transparent 60%),
                        linear-gradient(160deg, #FFF3C4, #FFE082, #F5B7B1, #C62828);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }
        .navbar {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(16px);
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .logo h2 { font-family: 'Playfair Display', serif; color: #8E0000; font-weight: 600; font-size: 1.3rem; }
        .admin-tabs { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .tab-btn { background: transparent; border: none; padding: 8px 16px; font-size: 0.95rem; font-weight: 600; color: #8E0000; border-radius: 40px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .tab-btn.active { background: #8E0000; color: white; box-shadow: 0 4px 12px rgba(142,0,0,0.3); }
        .tab-btn:hover:not(.active) { background: rgba(142,0,0,0.1); }
        .logout-btn { background: transparent; border: 1px solid #8E0000; padding: 6px 16px; border-radius: 40px; color: #8E0000; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
        .logout-btn:hover { background: #8E0000; color: white; }
        .admin-container { max-width: 1400px; margin: 0 auto; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 30px; padding: 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.6); max-height: calc(100vh - 120px); overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .section-header h1 { font-family: 'Playfair Display', serif; color: #8E0000; font-size: 1.8rem; }
        .submit-btn { background: #8E0000; border: none; color: white; font-weight: 600; padding: 10px 22px; border-radius: 40px; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 6px 12px rgba(142,0,0,0.2); }
        .submit-btn:hover { background: #C62828; transform: scale(1.02); }
        .print-btn { background: #28a745; }
        .print-btn:hover { background: #218838; }
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .item-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; border: 1px solid #ffe0a0; transition: 0.2s; display: flex; flex-direction: column; }
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 15px 25px rgba(0,0,0,0.15); }
        .item-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 15px; background: #f9f3e7; }
        .item-card video { width: 100%; max-height: 140px; border-radius: 15px; margin-top: 5px; background: black; }
        .item-card p { margin: 10px 0 8px; font-weight: 600; color: #5e2e2e; font-size: 0.95rem; }
        .card-actions { display: flex; gap: 8px; justify-content: center; margin-top: auto; padding-top: 10px; }
        .delete-btn { background: #8E0000; color: white; border: none; padding: 6px 14px; border-radius: 30px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .delete-btn:hover { background: #C62828; }
        .edit-btn { background: #ff9800; }
        .edit-btn:hover { background: #f57c00; }
        .create-form { background: rgba(255,245,220,0.7); border-radius: 25px; padding: 20px; margin-top: 25px; border: 1px solid #ffcd94; }
        .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1 1 200px; }
        .form-group label { font-weight: 600; color: #8E0000; display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 15px; border-radius: 30px; border: 1px solid #ccc; background: white; font-family: 'Poppins', sans-serif; }
        .toggle-section { display: flex; align-items: center; gap: 15px; background: #fff8e7; padding: 12px 20px; border-radius: 40px; margin-bottom: 15px; flex-wrap: wrap; }
        .hidden { display: none; }
        .inline-edit-panel { background: #fff8e7; border-radius: 25px; padding: 20px; margin-top: 20px; border: 2px solid #ff9800; }
        .inline-edit-panel h3 { color: #8E0000; margin-bottom: 15px; }
        .close-inline { float: right; font-size: 24px; cursor: pointer; color: #8E0000; }
        .search-bar { margin-bottom: 20px; display: flex; gap: 10px; }
        .search-bar input { flex: 1; padding: 12px 20px; border-radius: 40px; border: 1px solid #ccc; font-size: 1rem; }
        .event-group { margin-bottom: 30px; background: #fff8e7; border-radius: 20px; padding: 20px; }
        .event-group h2 { color: #8E0000; margin-bottom: 15px; font-family: 'Playfair Display', serif; border-bottom: 2px solid #ffb74d; padding-bottom: 8px; }
        .print-event-btn { background: #28a745; border: none; color: white; font-weight: 600; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; margin-left: 15px; transition: 0.2s; }
        .print-event-btn:hover { background: #218838; }
        .registrations-table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        .registrations-table th { background: #8E0000; color: white; padding: 10px; text-align: left; }
        .registrations-table td { padding: 10px; border-bottom: 1px solid #f0dbb4; }
        .registrations-table tr:last-child td { border-bottom: none; }
        .delete-reg-btn { background: #8E0000; color: white; border: none; padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .delete-reg-btn:hover { background: #C62828; }
        @media (max-width: 600px) {
            .navbar { flex-direction: column; align-items: stretch; }
            .logo { justify-content: center; }
            .admin-tabs { justify-content: center; }
            .section-header h1 { font-size: 1.5rem; }
            .item-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="/images/NudiUtsava Logo_2.png" alt="Logo">
            <h2>ನುಡಿ ಉತ್ಸವ · ADMIN</h2>
        </div>
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="showTab('home-mgmt')"><i class="fas fa-home"></i> Home</button>
            <button class="tab-btn" onclick="showTab('events-mgmt')"><i class="fas fa-calendar"></i> Events</button>
            <button class="tab-btn" onclick="showTab('sponsors-mgmt')"><i class="fas fa-handshake"></i> Sponsors</button>
            <button class="tab-btn" onclick="showTab('gallery-mgmt')"><i class="fas fa-images"></i> Gallery</button>
            <button class="tab-btn" onclick="showTab('registrations-mgmt')"><i class="fas fa-users"></i> Registered</button>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="admin-container">
        <!-- Home -->
        <div id="home-mgmt" class="tab-content active">
            <div class="section-header">
                <h1>🏠 Home Page Pictures</h1>
                <input type="file" id="homeFileInput" accept="image/*" style="display:none">
                <button class="submit-btn" onclick="document.getElementById('homeFileInput').click()"><i class="fas fa-plus-circle"></i> Add Image</button>
            </div>
            <div id="homeGrid" class="item-grid"></div>
            <div id="homeEditPanel" class="inline-edit-panel hidden">
                <span class="close-inline" onclick="closeInlineEdit('home')">&times;</span>
                <h3>Edit Home Image</h3>
                <div class="form-row">
                    <div class="form-group"><label>New image (optional)</label><input type="file" id="editHomeImage" accept="image/*"></div>
                </div>
                <button class="submit-btn" onclick="saveHomeEdit()">Update Image</button>
            </div>
        </div>

        <!-- Events (UPDATED) -->
        <div id="events-mgmt" class="tab-content">
            <div class="section-header">
                <h1>📋 Events</h1>
                <button class="submit-btn" onclick="document.getElementById('eventFormContainer').classList.toggle('hidden')"><i class="fas fa-plus-circle"></i> Create New Event</button>
            </div>
            <div id="eventsGrid" class="item-grid"></div>
            <div id="eventEditPanel" class="inline-edit-panel hidden">
                <span class="close-inline" onclick="closeInlineEdit('event')">&times;</span>
                <h3>Edit Event</h3>
                <div class="form-row">
                    <div class="form-group"><label>Event name</label><input type="text" id="editEventName"></div>
                    <div class="form-group"><label>New image (optional)</label><input type="file" id="editEventImage" accept="image/*"></div>
                </div>
                <!-- Registration Type -->
                <div class="toggle-section">
                    <span style="font-weight:600;">📝 Registration Type</span>
                    <label><input type="radio" name="editRegType" value="internal"> Internal Form (OTP + stored data)</label>
                    <label><input type="radio" name="editRegType" value="external"> External Google Form Link</label>
                </div>
                <div class="form-group" id="editExternalUrlGroup" style="display:none;">
                    <label>Google Form URL</label>
                    <input type="url" id="editEventRegisterPage" placeholder="https://forms.google.com/...">
                </div>
                <button class="submit-btn" onclick="saveEventEdit()">Update Event</button>
            </div>
            <div id="eventFormContainer" class="create-form hidden">
                <h3 style="color:#8E0000;"><i class="fas fa-pen"></i> New Event</h3>
                <div class="form-row">
                    <div class="form-group"><label>Event name</label><input type="text" id="eventName" placeholder="e.g. Nudi Nruthya"></div>
                    <div class="form-group"><label>Image upload</label><input type="file" id="eventImage" accept="image/*"></div>
                </div>
                <!-- Registration Type -->
                <div class="toggle-section">
                    <span style="font-weight:600;">📝 Registration Type</span>
                    <label><input type="radio" name="regType" value="internal" checked> Internal Form (OTP + stored data)</label>
                    <label><input type="radio" name="regType" value="external"> External Google Form Link</label>
                </div>
                <div class="form-group" id="externalUrlGroup" style="display:none;">
                    <label>Google Form URL</label>
                    <input type="url" id="eventRegisterPage" placeholder="https://forms.google.com/...">
                </div>
                <button class="submit-btn" onclick="createNewEvent()">Save Event</button>
            </div>
        </div>

        <!-- Sponsors -->
        <div id="sponsors-mgmt" class="tab-content">
            <div class="section-header">
                <h1>🤝 Sponsors</h1>
                <button class="submit-btn" onclick="document.getElementById('sponsorForm').classList.toggle('hidden')"><i class="fas fa-plus-circle"></i> Add Sponsor</button>
            </div>
            <div id="sponsorsGrid" class="item-grid"></div>
            <div id="sponsorEditPanel" class="inline-edit-panel hidden">
                <span class="close-inline" onclick="closeInlineEdit('sponsor')">&times;</span>
                <h3>Edit Sponsor</h3>
                <div class="form-row">
                    <div class="form-group"><label>Title</label><input type="text" id="editSponsorTitle"></div>
                    <div class="form-group"><label>New logo (optional)</label><input type="file" id="editSponsorLogo" accept="image/*"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>New cover (optional)</label><input type="file" id="editSponsorCover" accept="image/*"></div>
                    <div class="form-group"><label>New video (optional)</label><input type="file" id="editSponsorVideo" accept="video/mp4"></div>
                </div>
                <button class="submit-btn" onclick="saveSponsorEdit()">Update Sponsor</button>
            </div>
            <div id="sponsorForm" class="create-form hidden">
                <h3 style="color:#8E0000;">➕ New Sponsor</h3>
                <div class="form-row">
                    <div class="form-group"><label>Title</label><input id="spTitle" placeholder="Title sponsor"></div>
                    <div class="form-group"><label>Logo (image)</label><input type="file" id="spLogo" accept="image/*"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Cover picture (optional)</label><input type="file" id="spCover" accept="image/*"></div>
                    <div class="form-group"><label>Video file (mp4)</label><input type="file" id="spVideo" accept="video/mp4"></div>
                </div>
                <button class="submit-btn" onclick="addSponsor()">Upload sponsor</button>
            </div>
        </div>

        <!-- Gallery -->
        <div id="gallery-mgmt" class="tab-content">
            <div class="section-header">
                <h1>🖼️ Gallery</h1>
                <button class="submit-btn" onclick="document.getElementById('galleryUploadForm').classList.toggle('hidden')"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
            </div>
            <div id="galleryGrid" class="item-grid"></div>
            <div id="galleryEditPanel" class="inline-edit-panel hidden">
                <span class="close-inline" onclick="closeInlineEdit('gallery')">&times;</span>
                <h3>Edit Gallery Image</h3>
                <div class="form-row">
                    <div class="form-group"><label>Title</label><input type="text" id="editGalleryTitle"></div>
                    <div class="form-group"><label>New image (optional)</label><input type="file" id="editGalleryImage" accept="image/*"></div>
                </div>
                <button class="submit-btn" onclick="saveGalleryEdit()">Update Image</button>
            </div>
            <div id="galleryUploadForm" class="create-form hidden">
                <div class="form-row">
                    <div class="form-group"><label>Image title</label><input id="galleryTitle" placeholder="Festival highlight"></div>
                    <div class="form-group"><label>Image file</label><input type="file" id="galleryFile" accept="image/*"></div>
                </div>
                <button class="submit-btn" onclick="addGalleryItem()">Add to gallery</button>
            </div>
        </div>

        <!-- Registrations -->
        <div id="registrations-mgmt" class="tab-content">
            <div class="section-header">
                <h1>📋 Registered Users</h1>
                <div><button class="submit-btn print-btn" onclick="printRegistrations()"><i class="fas fa-print"></i> Print All</button></div>
            </div>
            <div class="search-bar">
                <input type="text" id="eventSearch" placeholder="Search event..." oninput="filterRegistrations()">
            </div>
            <div id="registrationsContainer"></div>
        </div>
    </div>

    <script>
        // Global state
        let currentEditId = null;
        let currentEditType = null;
        let allRegistrations = [];

        // Admin session check
        async function checkAdminSession(){
            try{
                const res = await fetch("/admin/check");
                const data = await res.json();
                if(!data.loggedIn) window.location.href="/admin";
            }catch(err){
                window.location.href="/admin";
            }
        }
        checkAdminSession();

        // Tab switching
        function showTab(tabId){
            document.querySelectorAll(".tab-content").forEach(tab => tab.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            document.getElementById(tabId).classList.add("active");
            const activeBtn = Array.from(document.querySelectorAll(".tab-btn")).find(btn => btn.getAttribute('onclick')?.includes(tabId));
            if(activeBtn) activeBtn.classList.add("active");

            if(tabId === "home-mgmt") loadHomeImages();
            if(tabId === "events-mgmt") loadEvents();
            if(tabId === "sponsors-mgmt") loadSponsors();
            if(tabId === "gallery-mgmt") loadGallery();
            if(tabId === "registrations-mgmt") loadRegistrations();

            closeAllInlineEdits();
        }

        function logout(){ window.location.href="/logout"; }
        function closeAllInlineEdits(){
            document.querySelectorAll('.inline-edit-panel').forEach(panel => panel.classList.add('hidden'));
            currentEditId = null;
            currentEditType = null;
        }
        function closeInlineEdit(type){
            document.getElementById(`${type}EditPanel`).classList.add('hidden');
            currentEditId = null;
            currentEditType = null;
        }

        // ---------- Helper for external URL toggle ----------
        function toggleRegType(isEdit = false) {
            const radioInternal = document.querySelector(isEdit ? 'input[name="editRegType"][value="internal"]' : 'input[name="regType"][value="internal"]');
            const radioExternal = document.querySelector(isEdit ? 'input[name="editRegType"][value="external"]' : 'input[name="regType"][value="external"]');
            const urlGroup = document.getElementById(isEdit ? 'editExternalUrlGroup' : 'externalUrlGroup');
            if (radioExternal.checked) urlGroup.style.display = 'block';
            else urlGroup.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const regRadios = document.querySelectorAll('input[name="regType"]');
            regRadios.forEach(r => r.addEventListener('change', () => toggleRegType(false)));
            const editRadios = document.querySelectorAll('input[name="editRegType"]');
            editRadios.forEach(r => r.addEventListener('change', () => toggleRegType(true)));
        });

        // ========== HOME ==========
        async function loadHomeImages() {
            try {
                const res = await fetch("/api/home-images");
                if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                const images = await res.json();
                document.getElementById("homeGrid").innerHTML = images.map(img => `
                    <div class="item-card">
                        <img src="${img.imageUrl}" onerror="this.src='/images/placeholder.png'">
                        <div class="card-actions">
                            <button class="delete-btn edit-btn" onclick="editHomeImage('${img._id}')">Edit</button>
                            <button class="delete-btn" onclick="deleteHomeImage('${img._id}')">Delete</button>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                console.error('Failed to load home images:', err);
                document.getElementById("homeGrid").innerHTML = '<p style="color:red;">Error loading images.</p>';
            }
        }
        async function deleteHomeImage(id){
            if (!confirm('Are you sure you want to delete this image?')) return;
            try {
                const res = await fetch("/api/home-images/"+id, { method:"DELETE" });
                if (!res.ok) throw new Error('Delete failed');
                alert('Image deleted successfully');
                loadHomeImages();
            } catch (err) {
                console.error('Delete error:', err);
                alert('Failed to delete image: ' + err.message);
            }
        }
        function editHomeImage(id){
            closeAllInlineEdits();
            currentEditId = id;
            currentEditType = 'home';
            document.getElementById('homeEditPanel').classList.remove('hidden');
        }
        async function saveHomeEdit(){
            if (!currentEditId || currentEditType !== 'home') return;
            const formData = new FormData();
            const file = document.getElementById("editHomeImage").files[0];
            if(file) formData.append("image", file);
            else { alert('Please select an image'); return; }
            try {
                const res = await fetch("/api/home-images/"+currentEditId, { method:"PUT", body:formData });
                if (!res.ok) throw new Error('Update failed');
                closeInlineEdit('home');
                loadHomeImages();
            } catch (err) {
                alert('Error updating image: ' + err.message);
            }
        }

        // ========== EVENTS (UPDATED) ==========
        async function loadEvents(){
            try {
                const res = await fetch("/api/events");
                if (!res.ok) throw new Error('Failed to fetch events');
                const events = await res.json();
                document.getElementById("eventsGrid").innerHTML = events.map(ev => `
                    <div class="item-card">
                        <img src="${ev.imageUrl || '/images/placeholder.png'}" onerror="this.src='/images/placeholder.png'">
                        <p>${ev.title}</p>
                        <div class="card-actions">
                            <button class="delete-btn edit-btn" onclick="editEvent('${ev._id}')">Edit</button>
                            <button class="delete-btn" onclick="deleteEvent('${ev._id}')">Delete</button>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                console.error('Error loading events:', err);
                document.getElementById("eventsGrid").innerHTML = '<p style="color:red;">Error loading events.</p>';
            }
        }
        async function deleteEvent(id){
            if (!confirm('Are you sure you want to delete this event?')) return;
            try {
                const res = await fetch("/api/events/"+id, { method:"DELETE" });
                if (!res.ok) throw new Error('Delete failed');
                alert('Event deleted');
                loadEvents();
            } catch (err) {
                console.error('Delete error:', err);
                alert('Failed to delete event');
            }
        }
        async function createNewEvent(){
            const title = document.getElementById("eventName").value.trim();
            if (!title) return alert('Please enter an event name');

            const formData = new FormData();
            formData.append("title", title);
            const file = document.getElementById("eventImage").files[0];
            if (file) formData.append("image", file);

            const regType = document.querySelector('input[name="regType"]:checked').value;
            const registerPage = regType === 'external' ? document.getElementById("eventRegisterPage").value.trim() : '';
            if (regType === 'external' && !registerPage) return alert('Please enter the Google Form URL');
            formData.append("registerPage", registerPage);
            formData.append("hasForm", "true");

            try {
                const res = await fetch("/api/events", { method: "POST", body: formData });
                if (!res.ok) throw new Error(await res.text());
                alert('Event created');
                loadEvents();
                document.getElementById("eventFormContainer").classList.add("hidden");
                document.getElementById("eventName").value = '';
                document.getElementById("eventImage").value = '';
                document.getElementById("eventRegisterPage").value = '';
                document.querySelector('input[name="regType"][value="internal"]').checked = true;
                toggleRegType(false);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        async function editEvent(id){
            closeAllInlineEdits();
            currentEditId = id;
            currentEditType = 'event';
            const res = await fetch("/api/events");
            const events = await res.json();
            const event = events.find(e => e._id === id);

            document.getElementById("editEventName").value = event.title;
            const isExternal = event.registerPage && event.registerPage.trim() !== '';
            if (isExternal) {
                document.querySelector('input[name="editRegType"][value="external"]').checked = true;
                document.getElementById("editEventRegisterPage").value = event.registerPage;
            } else {
                document.querySelector('input[name="editRegType"][value="internal"]').checked = true;
                document.getElementById("editEventRegisterPage").value = '';
            }
            toggleRegType(true);
            document.getElementById('eventEditPanel').classList.remove('hidden');
        }
        async function saveEventEdit(){
            if (!currentEditId || currentEditType !== 'event') return;
            const title = document.getElementById("editEventName").value.trim();
            if (!title) return alert('Event name cannot be empty');

            const formData = new FormData();
            formData.append("title", title);
            const file = document.getElementById("editEventImage").files[0];
            if (file) formData.append("image", file);

            const regType = document.querySelector('input[name="editRegType"]:checked').value;
            const registerPage = regType === 'external' ? document.getElementById("editEventRegisterPage").value.trim() : '';
            if (regType === 'external' && !registerPage) return alert('Please enter the Google Form URL');
            formData.append("registerPage", registerPage);
            formData.append("hasForm", "true");

            try {
                const res = await fetch("/api/events/"+currentEditId, { method:"PUT", body:formData });
                if (!res.ok) throw new Error(await res.text());
                closeInlineEdit('event');
                loadEvents();
            } catch (err) {
                alert('Error updating event: ' + err.message);
            }
        }

        // ========== SPONSORS ==========
        async function loadSponsors(){
            try {
                const res = await fetch("/api/sponsors");
                if (!res.ok) throw new Error('Failed to fetch sponsors');
                const sponsors = await res.json();
                document.getElementById("sponsorsGrid").innerHTML = sponsors.map(sp => `
                    <div class="item-card">
                        <img src="${sp.logoUrl || '/images/placeholder.png'}" onerror="this.src='/images/placeholder.png'">
                        <p>${sp.title}</p>
                        ${sp.videoUrl ? `<video src="${sp.videoUrl}" controls style="width:100%; max-height:100px; border-radius:10px;"></video>` : ''}
                        <div class="card-actions">
                            <button class="delete-btn edit-btn" onclick="editSponsor('${sp._id}')">Edit</button>
                            <button class="delete-btn" onclick="deleteSponsor('${sp._id}')">Delete</button>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                console.error('Error loading sponsors:', err);
                document.getElementById("sponsorsGrid").innerHTML = '<p style="color:red;">Error loading sponsors.</p>';
            }
        }
        async function addSponsor(){
            const title = document.getElementById("spTitle").value.trim();
            if (!title) return alert('Please enter sponsor title');
            const logo = document.getElementById("spLogo").files[0];
            const cover = document.getElementById("spCover").files[0];
            const video = document.getElementById("spVideo").files[0];
            const formData = new FormData();
            formData.append("title", title);
            if(logo) formData.append("logo", logo);
            if(cover) formData.append("cover", cover);
            if(video) formData.append("video", video);
            try {
                const res = await fetch("/api/sponsors", { method:"POST", body:formData });
                if (!res.ok) throw new Error('Failed to add sponsor');
                alert('Sponsor added');
                loadSponsors();
                document.getElementById("sponsorForm").classList.add("hidden");
                document.getElementById("spTitle").value = '';
                document.getElementById("spLogo").value = '';
                document.getElementById("spCover").value = '';
                document.getElementById("spVideo").value = '';
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        async function deleteSponsor(id){
            if (!confirm('Are you sure you want to delete this sponsor?')) return;
            try {
                const res = await fetch("/api/sponsors/"+id, { method:"DELETE" });
                if (!res.ok) throw new Error('Delete failed');
                alert('Sponsor deleted');
                loadSponsors();
            } catch (err) {
                console.error('Delete error:', err);
                alert('Failed to delete sponsor');
            }
        }
        async function editSponsor(id){
            closeAllInlineEdits();
            currentEditId = id;
            currentEditType = 'sponsor';
            const res = await fetch("/api/sponsors");
            const sponsors = await res.json();
            const sponsor = sponsors.find(s => s._id === id);
            document.getElementById("editSponsorTitle").value = sponsor.title;
            document.getElementById('sponsorEditPanel').classList.remove('hidden');
        }
        async function saveSponsorEdit(){
            if (!currentEditId || currentEditType !== 'sponsor') return;
            const formData = new FormData();
            formData.append("title", document.getElementById("editSponsorTitle").value);
            const logo = document.getElementById("editSponsorLogo").files[0];
            if(logo) formData.append("logo", logo);
            const cover = document.getElementById("editSponsorCover").files[0];
            if(cover) formData.append("cover", cover);
            const video = document.getElementById("editSponsorVideo").files[0];
            if(video) formData.append("video", video);
            try {
                const res = await fetch("/api/sponsors/"+currentEditId, { method:"PUT", body:formData });
                if (!res.ok) throw new Error('Update failed');
                closeInlineEdit('sponsor');
                loadSponsors();
            } catch (err) {
                alert('Error updating sponsor: ' + err.message);
            }
        }

        // ========== GALLERY ==========
        async function loadGallery(){
            try {
                const res = await fetch("/api/gallery");
                if (!res.ok) throw new Error('Failed to fetch gallery');
                const items = await res.json();
                document.getElementById("galleryGrid").innerHTML = items.map(g => `
                    <div class="item-card">
                        <img src="${g.imageUrl || '/images/placeholder.png'}" onerror="this.src='/images/placeholder.png'">
                        <p>${g.title}</p>
                        <div class="card-actions">
                            <button class="delete-btn edit-btn" onclick="editGallery('${g._id}')">Edit</button>
                            <button class="delete-btn" onclick="deleteGallery('${g._id}')">Delete</button>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                console.error('Error loading gallery:', err);
                document.getElementById("galleryGrid").innerHTML = '<p style="color:red;">Error loading gallery.</p>';
            }
        }
        async function addGalleryItem(){
            const title = document.getElementById("galleryTitle").value.trim();
            if (!title) return alert('Please enter a title');
            const file = document.getElementById("galleryFile").files[0];
            if (!file) return alert('Please select an image');
            const formData = new FormData();
            formData.append("title", title);
            formData.append("image", file);
            try {
                const res = await fetch("/api/gallery", { method:"POST", body:formData });
                if (!res.ok) throw new Error('Upload failed');
                alert('Image added to gallery');
                loadGallery();
                document.getElementById("galleryUploadForm").classList.add("hidden");
                document.getElementById("galleryTitle").value = '';
                document.getElementById("galleryFile").value = '';
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        async function deleteGallery(id){
            if (!confirm('Are you sure you want to delete this image?')) return;
            try {
                const res = await fetch("/api/gallery/"+id, { method:"DELETE" });
                if (!res.ok) throw new Error('Delete failed');
                alert('Image deleted successfully');
                loadGallery();
            } catch (err) {
                console.error('Delete error:', err);
                alert('Failed to delete image: ' + err.message);
            }
        }
        async function editGallery(id){
            closeAllInlineEdits();
            currentEditId = id;
            currentEditType = 'gallery';
            const res = await fetch("/api/gallery");
            const items = await res.json();
            const item = items.find(g => g._id === id);
            document.getElementById("editGalleryTitle").value = item.title;
            document.getElementById('galleryEditPanel').classList.remove('hidden');
        }
        async function saveGalleryEdit(){
            if (!currentEditId || currentEditType !== 'gallery') return;
            const formData = new FormData();
            formData.append("title", document.getElementById("editGalleryTitle").value);
            const file = document.getElementById("editGalleryImage").files[0];
            if(file) formData.append("image", file);
            try {
                const res = await fetch("/api/gallery/"+currentEditId, { method:"PUT", body:formData });
                if (!res.ok) throw new Error('Update failed');
                closeInlineEdit('gallery');
                loadGallery();
            } catch (err) {
                alert('Error updating gallery item: ' + err.message);
            }
        }

        // ========== REGISTRATIONS ==========
        async function loadRegistrations(){
            try {
                const res = await fetch("/api/registrations");
                if (!res.ok) throw new Error('Failed to fetch registrations');
                allRegistrations = await res.json();
                filterRegistrations();
            } catch (err) {
                console.error('Error loading registrations:', err);
                document.getElementById("registrationsContainer").innerHTML = '<p style="color:red;">Error loading registrations.</p>';
            }
        }
        function filterRegistrations() {
            const searchTerm = document.getElementById('eventSearch').value.toLowerCase();
            const filtered = allRegistrations.filter(r => r.eventName.toLowerCase().includes(searchTerm));
            renderRegistrations(filtered);
        }
        function renderRegistrations(registrations) {
            const container = document.getElementById('registrationsContainer');
            const groups = {};
            registrations.forEach(reg => { if (!groups[reg.eventName]) groups[reg.eventName] = []; groups[reg.eventName].push(reg); });
            if (Object.keys(groups).length === 0) { container.innerHTML = '<p style="text-align:center; padding:20px;">No registrations found.</p>'; return; }
            let html = '';
            for (let eventName in groups) {
                const regs = groups[eventName];
                html += `<div class="event-group"><h2>${eventName} (${regs.length})<button class="print-event-btn" onclick="printEventRegistrations('${eventName}')">Print this event</button></h2><table class="registrations-table"><thead><tr><th>Date</th><th>Details</th><th>Action</th></tr></thead><tbody>`;
                regs.forEach(r => {
                    const date = new Date(r.createdAt).toLocaleString();
                    const details = Object.entries(r.formData).map(([k,v]) => `<b>${k}:</b> ${v}`).join('<br>');
                    html += `<tr><td>${date}</td><td>${details}</td><td><button class="delete-reg-btn" onclick="deleteRegistration('${r._id}')">Delete</button></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            container.innerHTML = html;
        }
        async function deleteRegistration(id) {
            if (!confirm('Are you sure you want to delete this registration?')) return;
            try {
                const res = await fetch("/api/registrations/"+id, { method:"DELETE" });
                if (!res.ok) throw new Error('Delete failed');
                alert('Registration deleted');
                loadRegistrations();
            } catch (err) {
                console.error('Delete error:', err);
                alert('Failed to delete registration');
            }
        }
        function printRegistrations() {
            const printContents = document.getElementById('registrationsContainer').innerHTML;
            const originalTitle = document.title;
            document.title = 'All Registrations - Nudi Utsava';
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`<html><head><title>All Registrations</title><style>body{font-family:Arial,sans-serif;padding:20px;} .event-group{margin-bottom:30px;} h2{color:#8E0000;border-bottom:2px solid #ffb74d;padding-bottom:5px;} table{width:100%;border-collapse:collapse;margin-bottom:20px;} th{background:#8E0000;color:white;padding:8px;text-align:left;} td{padding:8px;border-bottom:1px solid #ddd;}</style></head><body>${printContents}</body></html>`);
            printWindow.document.close();
            printWindow.focus();
            printWindow.print();
            document.title = originalTitle;
        }
        function printEventRegistrations(eventName) {
            const eventRegs = allRegistrations.filter(r => r.eventName === eventName);
            if (eventRegs.length === 0) { alert('No registrations for this event.'); return; }
            const printContents = `<h2>${eventName} (${eventRegs.length})</h2><table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse; width:100%;"><thead><tr><th>Date</th><th>Details</th></tr></thead><tbody>${eventRegs.map(r => `<tr><td>${new Date(r.createdAt).toLocaleString()}</td><td>${Object.entries(r.formData).map(([k,v]) => `<b>${k}:</b> ${v}`).join('<br>')}</td></tr>`).join('')}</tbody></table>`;
            const win = window.open('', '_blank');
            win.document.write(`<html><head><title>${eventName} - Registrations</title></head><body>${printContents}</body></html>`);
            win.document.close();
            win.print();
        }

        // Home image upload trigger
        document.getElementById('homeFileInput').addEventListener('change', async function() {
            if (this.files.length) {
                const formData = new FormData();
                formData.append('image', this.files[0]);
                try {
                    const res = await fetch('/api/home-images', { method: 'POST', body: formData });
                    if (!res.ok) throw new Error('Upload failed');
                    loadHomeImages();
                } catch (err) { alert('Error uploading image: ' + err.message); }
                this.value = '';
            }
        });

        window.onload = function(){ showTab('home-mgmt'); };
    </script>
</body>
</html>
