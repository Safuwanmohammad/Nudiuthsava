<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register for Event · Nudi Utsava</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .small-btn {
            margin-top: 5px;
            padding: 6px 12px;
            background: #8E0000;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        .info-message {
            font-size: 0.8rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <section class="form-section">
        <div class="form-box">
            <a href="index.html" class="back-btn">← Back to Home</a>
            <h1>Event Registration</h1>

            <form id="registrationForm">
                <!-- Student Name -->
                <div class="form-group">
                    <label>Student Participant's Name *</label>
                    <input type="text" name="studentName" required>
                </div>

                <!-- Student Email with OTP -->
                <div class="form-group">
                    <label>Student's Email *</label>
                    <input type="email" name="studentEmail" id="studentEmail" required>
                    <button type="button" id="sendOtpBtn" class="small-btn">Send OTP</button>
                    <div id="otpSection" style="display:none;">
                        <label>Enter OTP *</label>
                        <input type="text" id="otpInput" required>
                        <button type="button" id="verifyOtpBtn" class="small-btn">Verify OTP</button>
                    </div>
                    <div id="otpMessage" class="info-message"></div>
                </div>

                <!-- Student Phone (no OTP) -->
                <div class="form-group">
                    <label>Student's Phone Number *</label>
                    <input type="tel" name="studentPhone" required>
                </div>

                <!-- College Name -->
                <div class="form-group">
                    <label>College Name *</label>
                    <input type="text" name="collegeName" required>
                </div>

                <!-- Principal Name -->
                <div class="form-group">
                    <label>Principal Name *</label>
                    <input type="text" name="principalName" required>
                </div>

                <!-- Principal Phone -->
                <div class="form-group">
                    <label>Principal Phone Number *</label>
                    <input type="tel" name="principalPhone" required>
                </div>

                <!-- Course -->
                <div class="form-group">
                    <label>Course *</label>
                    <input type="text" name="course" required>
                </div>

                <!-- Semester -->
                <div class="form-group">
                    <label>Semester *</label>
                    <input type="text" name="semester" required>
                </div>

                <!-- Event Dropdown -->
                <div class="form-group">
                    <label>Choose Event *</label>
                    <select name="eventName" id="eventSelect" required>
                        <option value="">-- Select an event --</option>
                    </select>
                </div>

                <!-- Dynamic field for Nudi Nruthya Sambhrama (hidden by default) -->
                <div class="form-group" id="participantsField" style="display: none;">
                    <label>Number of participants (minimum 6, maximum 12) *</label>
                    <input type="number" name="participants" min="6" max="12" step="1">
                </div>

                <!-- Optional Message -->
                <div class="form-group">
                    <label>Message (Optional)</label>
                    <textarea name="message" rows="4"></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="submit-btn">Submit</button>
                    <button type="reset" class="reset-btn">Reset</button>
                </div>

                <div id="successMessage" class="success" style="display:none;">✅ Registration successful!</div>
                <div id="errorMessage" class="error" style="display:none; color:#C62828;"></div>
            </form>
        </div>
    </section>

    <script>
        let otpVerified = false;
        let userEmail = '';

        // Fetch events for dropdown
        async function loadEventsForDropdown() {
            try {
                const res = await fetch('/api/events');
                if (!res.ok) throw new Error('Failed to load events');
                const events = await res.json();
                const select = document.getElementById('eventSelect');
                select.innerHTML = '<option value="">-- Select an event --</option>';
                events.forEach(ev => {
                    const option = document.createElement('option');
                    option.value = ev.title;
                    option.textContent = ev.title;
                    select.appendChild(option);
                });

                const urlParams = new URLSearchParams(window.location.search);
                const preselected = urlParams.get('event');
                if (preselected) {
                    const option = Array.from(select.options).find(opt => opt.value === preselected);
                    if (option) {
                        option.selected = true;
                        select.dispatchEvent(new Event('change'));
                    }
                }
            } catch (err) {
                console.error('Error loading events:', err);
                document.getElementById('errorMessage').textContent = 'Could not load events. Please try again later.';
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        function handleEventChange() {
            const select = document.getElementById('eventSelect');
            const selected = select.value;
            const participantsDiv = document.getElementById('participantsField');
            const participantsInput = participantsDiv.querySelector('input[name="participants"]');
            
            if (selected === 'Nudi Nruthya Sambhrama') {
                participantsDiv.style.display = 'block';
                participantsInput.required = true;
            } else {
                participantsDiv.style.display = 'none';
                participantsInput.required = false;
                participantsInput.value = '';
            }
        }

        // OTP handlers
        document.getElementById('sendOtpBtn').addEventListener('click', async () => {
            const email = document.getElementById('studentEmail').value.trim();
            if (!email) {
                alert('Please enter email address');
                return;
            }
            userEmail = email;
            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                if (res.ok) {
                    document.getElementById('otpSection').style.display = 'block';
                    document.getElementById('otpMessage').innerHTML = 'OTP sent to your email!';
                } else {
                    alert('Failed to send OTP');
                }
            } catch (err) {
                console.error(err);
                alert('Error sending OTP');
            }
        });

        document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
            const otp = document.getElementById('otpInput').value.trim();
            if (!otp) {
                alert('Enter OTP');
                return;
            }
            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp })
                });
                if (res.ok) {
                    otpVerified = true;
                    document.getElementById('otpMessage').innerHTML = '<span style="color:green;">✔ Verified</span>';
                    document.getElementById('verifyOtpBtn').disabled = true;
                } else {
                    const data = await res.json();
                    alert(data.error || 'Verification failed');
                }
            } catch (err) {
                console.error(err);
                alert('Error verifying OTP');
            }
        });

        // Form submission with OTP check
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!otpVerified) {
                alert('Please verify your email with OTP first.');
                return;
            }

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // Basic validation for participants range
            if (data.eventName === 'Nudi Nruthya Sambhrama') {
                const participants = parseInt(data.participants, 10);
                if (isNaN(participants) || participants < 6 || participants > 12) {
                    alert('Please enter a valid number of participants (6 to 12).');
                    return;
                }
            }

            try {
                const res = await fetch('/api/registrations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        eventName: data.eventName,
                        formData: data
                    })
                });

                if (res.ok) {
                    document.getElementById('successMessage').style.display = 'block';
                    e.target.reset();
                    document.getElementById('participantsField').style.display = 'none';
                    // Reset OTP state
                    otpVerified = false;
                    document.getElementById('otpSection').style.display = 'none';
                    document.getElementById('otpMessage').innerHTML = '';
                    document.getElementById('verifyOtpBtn').disabled = false;
                    setTimeout(() => {
                        document.getElementById('successMessage').style.display = 'none';
                    }, 3000);
                } else {
                    const err = await res.json();
                    alert('Registration failed: ' + (err.error || 'Unknown error'));
                }
            } catch (err) {
                console.error(err);
                alert('Error submitting form. Please try again.');
            }
        });

        document.getElementById('eventSelect').addEventListener('change', handleEventChange);
        loadEventsForDropdown();
    </script>
</body>
</html>
