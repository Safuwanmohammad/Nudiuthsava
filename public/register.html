<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register for Event · Nudi Utsava</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Modal overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 40px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }
        .modal-content button {
            background: #8E0000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
        }
        .modal-content button:hover {
            background: #C62828;
        }
        .info-message {
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 12px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <section class="form-section">
        <div class="form-box">
            <a href="index.html" class="back-btn">← Back to Home</a>
            <h1>Event Registration</h1>

            <form id="registrationForm">
                <div class="form-group">
                    <label>Student Participant's Name *</label>
                    <input type="text" name="studentName" required>
                </div>
                <div class="form-group">
                    <label>Student's Email *</label>
                    <input type="email" name="studentEmail" id="studentEmail" required>
                </div>
                <div class="form-group">
                    <label>Student's Phone Number *</label>
                    <input type="tel" name="studentPhone" required>
                </div>
                <div class="form-group">
                    <label>College Name *</label>
                    <input type="text" name="collegeName" required>
                </div>
                <div class="form-group">
                    <label>Principal Name *</label>
                    <input type="text" name="principalName" required>
                </div>
                <div class="form-group">
                    <label>Principal Phone Number *</label>
                    <input type="tel" name="principalPhone" required>
                </div>
                <div class="form-group">
                    <label>Course *</label>
                    <input type="text" name="course" required>
                </div>
                <div class="form-group">
                    <label>Semester *</label>
                    <input type="text" name="semester" required>
                </div>
                <div class="form-group">
                    <label>Choose Event *</label>
                    <select name="eventName" id="eventSelect" required>
                        <option value="">-- Select an event --</option>
                    </select>
                </div>
                <div class="form-group" id="participantsField" style="display: none;">
                    <label>Number of participants (min 6, max 12) *</label>
                    <input type="number" name="participants" min="6" max="12" step="1">
                </div>
                <div class="form-group">
                    <label>Message (Optional)</label>
                    <textarea name="message" rows="4"></textarea>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="submit-btn">Submit</button>
                    <button type="reset" class="reset-btn">Reset</button>
                </div>
                <div id="successMessage" class="success" style="display:none;">✅ Registration successful!</div>
                <div id="errorMessage" class="error" style="display:none; color:#C62828;"></div>
            </form>
        </div>
    </section>

    <!-- OTP Modal -->
    <div id="otpModal" class="modal">
        <div class="modal-content">
            <h3>Verify Your Email</h3>
            <p>We've sent an OTP to <strong><span id="otpEmailDisplay"></span></strong></p>
            <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" autocomplete="off">
            <button id="modalVerifyBtn">Verify & Register</button>
            <div id="modalMessage" style="margin-top: 10px; color: red;"></div>
        </div>
    </div>

    <script>
        let pendingFormData = null;
        let currentEmail = '';

        // Load events into dropdown
        async function loadEventsForDropdown() {
            try {
                const res = await fetch('/api/events');
                if (!res.ok) throw new Error('Failed to load events');
                const events = await res.json();
                const select = document.getElementById('eventSelect');
                select.innerHTML = '<option value="">-- Select an event --</option>';
                events.forEach(ev => {
                    const option = document.createElement('option');
                    option.value = ev.title;
                    option.textContent = ev.title;
                    select.appendChild(option);
                });

                // Pre-select from URL parameter
                const urlParams = new URLSearchParams(window.location.search);
                const preselected = urlParams.get('event');
                if (preselected) {
                    const option = Array.from(select.options).find(opt => opt.value === preselected);
                    if (option) {
                        option.selected = true;
                        handleEventChange();
                    }
                }
            } catch (err) {
                console.error(err);
                document.getElementById('errorMessage').textContent = 'Could not load events.';
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        function handleEventChange() {
            const select = document.getElementById('eventSelect');
            const selected = select.value;
            const participantsDiv = document.getElementById('participantsField');
            const participantsInput = participantsDiv.querySelector('input[name="participants"]');
            if (selected === 'Nudi Nruthya Sambhrama') {
                participantsDiv.style.display = 'block';
                participantsInput.required = true;
            } else {
                participantsDiv.style.display = 'none';
                participantsInput.required = false;
                participantsInput.value = '';
            }
        }

        document.getElementById('eventSelect').addEventListener('change', handleEventChange);

        // Step 1: On form submit, send OTP and show modal
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // Validate participants for specific event
            if (data.eventName === 'Nudi Nruthya Sambhrama') {
                const participants = parseInt(data.participants, 10);
                if (isNaN(participants) || participants < 6 || participants > 12) {
                    alert('Please enter a valid number of participants (6 to 12).');
                    return;
                }
            }

            if (!data.studentEmail) {
                alert('Email is required');
                return;
            }

            pendingFormData = data;
            currentEmail = data.studentEmail;
            document.getElementById('otpEmailDisplay').innerText = currentEmail;

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });
                if (res.ok) {
                    document.getElementById('otpModal').style.display = 'flex';
                    document.getElementById('modalMessage').innerText = '';
                    document.getElementById('otpInput').value = '';
                } else {
                    alert('Failed to send OTP. Please try again.');
                }
            } catch (err) {
                console.error(err);
                alert('Error sending OTP');
            }
        });

        // Step 2: Verify OTP and then register
        document.getElementById('modalVerifyBtn').addEventListener('click', async () => {
            const otp = document.getElementById('otpInput').value.trim();
            if (!otp) {
                document.getElementById('modalMessage').innerText = 'Please enter OTP';
                return;
            }

            try {
                const verifyRes = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });

                if (!verifyRes.ok) {
                    const errData = await verifyRes.json();
                    document.getElementById('modalMessage').innerText = errData.error || 'Invalid OTP';
                    return;
                }

                // OTP verified – now submit registration
                const regRes = await fetch('/api/registrations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        eventName: pendingFormData.eventName,
                        formData: pendingFormData
                    })
                });

                if (regRes.ok) {
                    document.getElementById('otpModal').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('registrationForm').reset();
                    document.getElementById('participantsField').style.display = 'none';
                    setTimeout(() => {
                        document.getElementById('successMessage').style.display = 'none';
                    }, 4000);
                } else {
                    const err = await regRes.json();
                    document.getElementById('modalMessage').innerText = err.error || 'Registration failed';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('modalMessage').innerText = 'Server error. Please try again.';
            }
        });

        // Close modal if clicked outside
        window.onclick = function(event) {
            const modal = document.getElementById('otpModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };

        loadEventsForDropdown();
    </script>
</body>
</html>
